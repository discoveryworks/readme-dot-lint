# ABOUTME: GitHub Actions workflow to detect new README.lint badge adoptions weekly.
# ABOUTME: Searches GitHub for repositories using the README.lint badge and reports findings.

name: Detect Badge Adoptions

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  detect-adoptions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run badge detection script
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/detect-new-adoptions.js > adoptions-report.json 2> detection.log || true

          # Show the logs
          cat detection.log

          # Save report as output
          if [ -f adoptions-report.json ]; then
            echo "report<<EOF" >> $GITHUB_OUTPUT
            cat adoptions-report.json >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Upload adoption report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adoption-report
          path: |
            adoptions-report.json
            detection.log
          retention-days: 90

      - name: Create issue for new adoptions
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse the report to check if there are new adoptions
          if [ -f adoptions-report.json ]; then
            NEW_COUNT=$(jq -r '.new' adoptions-report.json)
            TOTAL_COUNT=$(jq -r '.total' adoptions-report.json)

            if [ "$NEW_COUNT" -gt 0 ]; then
              # Extract new repositories
              NEW_REPOS=$(jq -r '.repositories[] | select(.name) | "- [\(.name)](\(.url)) (\(.stars) ⭐)"' adoptions-report.json | head -n $NEW_COUNT)

              # Create issue body
              ISSUE_BODY="## New README.lint Badge Adoptions Detected! 🎉

We found **${NEW_COUNT}** new repositories using the README.lint badge!

### New Adoptions:
${NEW_REPOS}

### Summary:
- **Total repositories with badge**: ${TOTAL_COUNT}
- **New this week**: ${NEW_COUNT}

---
*Detected on $(date '+%Y-%m-%d')*
*Report generated by automated badge detection workflow*"

              # Create the issue
              gh issue create \
                --title "🎉 ${NEW_COUNT} New Badge Adoption(s) - $(date '+%Y-%m-%d')" \
                --body "$ISSUE_BODY" \
                --label "adoption,automated"
            else
              echo "No new adoptions detected this week."
            fi
          fi
